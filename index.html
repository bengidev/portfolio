<html lang="en" class="scheme-light dark:scheme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

      name="description"
      content="Bambang Tri Rahmat Doni — software engineer based in Indonesia. Selected work, experience, and what I have been building."
    />

    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Bambang Tri Rahmat Doni — Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer based in Indonesia. Selected work, experience, and what I have been building."
    />

    <script>
      // Resolve the theme before first paint so there is no flash of the wrong
      // colour scheme. Mirrors src/lib/theme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* localStorage unavailable (private mode) — fall back to light. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
